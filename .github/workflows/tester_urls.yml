name: Vérification des URLs LinkedIn

on:
  # Permet de lancer le script manuellement depuis l'onglet Actions de GitHub
  workflow_dispatch:
  # Optionnel : Déclenche le script à chaque fois que vous faites un "git push"
  push:
    branches:
      - main

jobs:
  verifier-urls:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère les fichiers de votre dépôt
      - name: Extraction du code source
        uses: actions/checkout@v4

      # 2. Configure l'environnement Python
      - name: Configuration de Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Installe les dépendances requises
      - name: Installation de la bibliothèque requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. Exécute votre script Python
      - name: Lancement du script de test
        run: python script_test.py

      # 5. Sauvegarde et rend téléchargeable le fichier résultat
      - name: Sauvegarde du fichier de résultat
        uses: actions/upload-artifact@v4
        with:
          name: resultat-validation-urls
          path: resultat_test_urls.csv